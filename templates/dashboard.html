<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <nav class="navbar navbar-light bg-white shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">My App</span>
        <span class="text-muted">v{{ version }}</span>
      </div>
    </nav>
    <main class="container py-4">
      <div class="row">
        <div class="col-12">
          <h3>Welcome, {{ user }}!</h3>
          <p class="text-muted">You are logged in. This simple dashboard demonstrates a successful redirect after login.</p>
          <a href="/login" class="btn btn-secondary">Log out</a>
        </div>
      </div>
    </main>
  </body>
</html>
