# .github/workflows/deploy.yml
name: Flask CI/CD Deployment

on:
  push:
    branches:
      - main # Run this workflow whenever a push is made to the main branch
  workflow_dispatch: # Allows manual trigger

env:
  DOCKER_IMAGE_NAME: flask-app

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        FLASK_SECRET: test-secret-for-ci-only
            run: python -m pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up QEMU (Required for multi-arch build)
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # 3. Set up Docker BuildX (Better builder)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Build and Push Docker Image
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}, ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

    # 6. Deploy to EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

          IMAGE_TAG=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker pull $IMAGE_TAG

          docker stop ${{ env.DOCKER_IMAGE_NAME }} || true
          docker rm ${{ env.DOCKER_IMAGE_NAME }} || true

          docker run -d \
            --name ${{ env.DOCKER_IMAGE_NAME }} \
            -p 80:5000 \
            -e APP_VERSION=${{ github.sha }} \
            -e FLASK_SECRET=${{ secrets.FLASK_SECRET }} \
            $IMAGE_TAG

          docker image prune -f